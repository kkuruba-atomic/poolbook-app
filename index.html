<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoolBook – CRM for pool service pros</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b4f5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoolBook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef6f7;--card:#fff;--ink:#0d2b33;--mute:#5b7780;--line:#d3e4e8;--aqua:#0aa5b8;--deep:#0b4f5c;--chip:#e0f1f4;--bad:#cf3f4f;--ok:#2a9d5c}
@media(prefers-color-scheme:dark){:root{--bg:#0a1a1f;--card:#112a31;--ink:#e6f4f6;--mute:#8fb0b8;--line:#1f4048;--aqua:#2cc6d8;--deep:#7fdbe8;--chip:#173840}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:0 0 env(safe-area-inset-bottom)}
header{background:#0b4f5c;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}.top{display:flex;justify-content:space-between;align-items:center;max-width:860px;margin:auto}
.logo{font-weight:800;font-size:22px}.logo span{color:#7fe3ef}
main{max-width:860px;margin:auto;padding:16px 16px 60px}
.card,.stop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.stop{border-left:6px solid var(--aqua);cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between}.stop.done{border-left-color:var(--ok)}
.stop h3{margin:0;font-size:17px}.stop p{margin:2px 0;color:var(--mute);font-size:14px}
.tag{display:inline-block;background:var(--chip);color:var(--deep);border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600;margin:5px 5px 0 0}.tag.alert{background:#fbe3e6;color:var(--bad)}
.btn{background:var(--aqua);color:#04262c;border:0;border-radius:10px;padding:10px 14px;font:700 14px system-ui;cursor:pointer}.btn.ghost{background:var(--chip);color:var(--deep)}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.day{flex:1;min-width:62px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px;color:var(--ink);font:inherit;cursor:pointer}.day.on{background:var(--aqua);border-color:var(--aqua);color:#04262c}
input,select,textarea{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit}
label{font-size:13px;font-weight:600;color:var(--mute);display:block;margin-bottom:3px}
dialog{border:0;border-radius:16px;padding:20px;width:min(560px,94vw);background:var(--bg);color:var(--ink)}dialog::backdrop{background:rgba(3,25,30,.6)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}
.auth{max-width:380px;margin:50px auto}.auth input{margin-bottom:10px}.err{color:var(--bad);min-height:20px}.err.good{color:var(--ok)}
.link{background:none;border:0;color:var(--aqua);font:600 14px system-ui;cursor:pointer;padding:6px}
.tip{display:flex;gap:10px;align-items:center;background:var(--chip);color:var(--deep);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}.tip img{width:36px;height:36px;border-radius:8px}.tip b{display:block}.tip .x{margin-left:auto;background:none;border:0;color:var(--deep);font-size:20px;cursor:pointer;padding:4px 8px}
.tip.off{background:#fff4dc;color:#6b4a00}@media(prefers-color-scheme:dark){.tip.off{background:#3a2e10;color:#ffd98a}}
.note{background:#fff4dc;color:#6b4a00;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:10px}@media(prefers-color-scheme:dark){.note{background:#3a2e10;color:#ffd98a}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.log{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
</style></head><body>
<header><div class="top"><div class="logo">Pool<span>Book</span></div><div style="display:flex;gap:8px"><button class="btn ghost" id="inst" hidden onclick="install()">Install app</button><div id="hdr"></div></div></div></header>
<main id="main"><p style="text-align:center;color:var(--mute);margin-top:60px">Loading PoolBook…</p></main>
<dialog id="dlg"></dialog>
<script>
// ===== CONFIG (these two values are public by design; security comes from the database rules) =====
const SUPABASE_URL='https://tqntqxiqibgxzpnmirhh.supabase.co';
const SUPABASE_KEY='sb_publishable_InWo3BZlgcGyNPazV0WPSA_aBCZ8lBx';
const STRIPE_LINK='https://buy.stripe.com/test_00wcN752actaa6i1BA0x202';
// =================================================================================================
// Read the URL before Supabase processes it: a password-reset email link lands here with "type=recovery".
let RECOVERY=location.hash.includes('type=recovery');
const LINK_ERR=new URLSearchParams(location.hash.slice(1)).get('error_description');
const sb=window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
sb?.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;newPwScreen()}});
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
let C=[],day=DAYS[Math.max(0,Math.min(5,(new Date().getDay()+6)%7))],view='route',user=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const clearHash=()=>history.replaceState(null,'',location.pathname);

async function boot(){
 if(LINK_ERR&&!RECOVERY){clearHash();return authScreen(LINK_ERR+'. Tap “Forgot password?” to get a new link.')}
 if(!sb||!navigator.onLine)return goOffline(lastId());
 // with weak signal, don't wait forever: after 5 seconds fall back to the saved copy
 const res=await Promise.race([sb.auth.getSession(),new Promise(r=>setTimeout(()=>r(null),5000))]);
 if(!res)return goOffline(lastId());
 const session=res.data?.session;
 if(RECOVERY&&session)return newPwScreen();
 if(!session)return navigator.onLine?authScreen():goOffline(lastId());
 user=session.user;signOutBtn();
 const{data:p,error:pe}=await sb.from('profiles').select('active').eq('id',user.id).maybeSingle();
 if(pe)return goOffline(user.id);
 if(!p?.active){wipeCache();return paywall()}
 await load();
}
function authScreen(msg='',good=false){
 $('hdr').innerHTML='';
 main.innerHTML=`<div class="card auth"><h2 style="margin-top:0">Log in to PoolBook</h2><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"><div class="err ${good?'good':''}" id="er">${esc(msg)}</div><div class="row"><button class="btn" onclick="auth('in')">Log in</button><button class="btn ghost" onclick="auth('up')">Create account</button></div><p style="text-align:center;margin:10px 0 0"><button class="link" onclick="forgot()">Forgot password?</button></p></div>`}
async function auth(k){
 const email=$('em').value.trim(),password=$('pw').value;$('er').textContent='';
 const r=k==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(r.error)return $('er').textContent=r.error.message;
 if(k==='up'&&!r.data.session)return authScreen('Check your email to confirm your account, then log in.',true);
 boot()}
async function forgot(){
 const email=$('em').value.trim(),er=$('er');er.className='err';
 if(!email){er.textContent='Type your email above, then tap “Forgot password?”.';return $('em').focus()}
 er.textContent='Sending…';
 const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
 if(r.error)return er.textContent=r.error.message;
 authScreen('If that email has a PoolBook account, a reset link is on its way. Check your inbox and spam folder.',true)}
function newPwScreen(){
 $('hdr').innerHTML='';
 main.innerHTML=`<div class="card auth"><h2 style="margin-top:0">Set a new password</h2><input id="np" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><input id="np2" type="password" placeholder="Repeat new password" autocomplete="new-password"><div class="err" id="er"></div><div class="row"><button class="btn" onclick="setPw()">Save new password</button></div></div>`}
async function setPw(){
 const a=$('np').value,b=$('np2').value,er=$('er');
 if(a.length<6)return er.textContent='Use at least 6 characters.';
 if(a!==b)return er.textContent='Those two passwords don’t match.';
 er.textContent='Saving…';
 const r=await sb.auth.updateUser({password:a});
 if(r.error)return er.textContent=r.error.message;
 RECOVERY=false;clearHash();boot()}
// ===== Saved copy for no-signal use (one account per phone; wiped on sign-out) =====
let OFFLINE=false,CACHED_AT=0;
const CK=id=>'pb_cache_'+id;
function lastId(){try{return localStorage.getItem('pb_last')}catch(e){return null}}
function saveCache(){try{localStorage.setItem(CK(user.id),JSON.stringify({at:Date.now(),email:user.email,C}));localStorage.setItem('pb_last',user.id)}catch(e){}}
function readCache(id){try{return id?JSON.parse(localStorage.getItem(CK(id))||'null'):null}catch(e){return null}}
function wipeCache(){try{Object.keys(localStorage).filter(k=>k.startsWith('pb_cache_')||k==='pb_last').forEach(k=>localStorage.removeItem(k))}catch(e){}}
function goOffline(id){const c=readCache(id);if(!c)return offlineScreen();
 OFFLINE=true;CACHED_AT=c.at;C=c.C;if(!user)user={id,email:c.email};signOutBtn();render()}
const isNetErr=e=>!navigator.onLine||/fetch|load failed|network/i.test(e?.message||'');
function signOutBtn(){$('hdr').innerHTML=`<button class="btn ghost" onclick="signOut()">Sign out</button>`}
async function signOut(){wipeCache();
 const r=sb&&navigator.onLine?await sb.auth.signOut().catch(e=>({error:e})):{error:1};
 if(r?.error)try{Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k))}catch(e){} // offline: forget the login on this phone
 location.reload()}
function savedWhen(){const d=new Date(CACHED_AT),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 return d.toDateString()===new Date().toDateString()?t:d.toLocaleDateString([],{month:'short',day:'numeric'})+' at '+t}
const offNote=()=>OFFLINE?`<div class="note">📶 You’re offline. You can look at everything, but saving waits until you have signal.</div>`:'';
function offlineScreen(){
 main.innerHTML=`<div class="card auth" style="text-align:center"><div style="font-size:40px">📶</div><h2 style="margin:6px 0">No signal right now</h2><p style="color:var(--mute)">PoolBook needs a connection to load your customers. It will reload on its own when signal comes back.</p><button class="btn" onclick="boot()">Try again</button></div>`}
addEventListener('online',()=>{if(OFFLINE||main.querySelector('.auth h2')?.textContent==='No signal right now'){OFFLINE=false;sb?boot():location.reload()}});
function paywall(){
 main.innerHTML=`<div class="card auth" style="text-align:center"><h2 style="margin-top:0">Activate your account</h2><p>PoolBook is $40/month. Subscribe, then your account is switched on within one business day.</p><p style="color:var(--mute);font-size:14px">Signed in as ${esc(user.email)}</p><a class="btn" style="display:inline-block;text-decoration:none" href="${STRIPE_LINK}?prefilled_email=${encodeURIComponent(user.email)}">Subscribe – $40/mo</a><p><button class="btn ghost" onclick="boot()">I've subscribed – refresh</button></p></div>`}

async function load(){
 const{data,error}=await sb.from('customers').select('*, visits(d,fc,ph,ta,chem,note)').order('name');
 if(error)return isNetErr(error)?goOffline(user.id):main.innerHTML=`<div class="card">Could not load data: ${esc(error.message)}</div>`;
 OFFLINE=false;C=data.map(c=>({...c,visits:(c.visits||[]).sort((a,b)=>b.d.localeCompare(a.d))}));saveCache();render()}
const lastV=c=>c.visits[0];
const tags=c=>`<span class="tag">${esc(c.san)}</span><span class="tag">${esc(c.surf)}</span><span class="tag">${(+c.gal||0).toLocaleString()} gal</span>${c.dog?'<span class="tag alert">🐕 Dog on site</span>':''}`;
function render(){
 const list=view==='route'?C.filter(c=>c.day===day):C;
 const nav=`<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn ${view==='route'?'':'ghost'}" onclick="view='route';render()">Route</button><button class="btn ${view==='all'?'':'ghost'}" onclick="view='all';render()">All customers</button><span style="flex:1"></span><button class="btn" onclick="openCust()">+ New customer</button></div>`;
 const days=view==='route'?`<div class="days">${DAYS.map(d=>`<button class="day ${d===day?'on':''}" onclick="day='${d}';render()"><b>${d}</b><br><small>${C.filter(c=>c.day===d).length} pools</small></button>`).join('')}</div>`:'';
 const off=OFFLINE?`<div class="tip off"><div style="font-size:22px">📶</div><div><b>Offline</b>Showing your list as saved ${savedWhen()}. Changes can’t be saved until you have signal.</div><button class="btn ghost" style="margin-left:auto" onclick="if(!sb)return location.reload();OFFLINE=false;boot()">Retry</button></div>`:'';
 main.innerHTML=off+iosTip()+nav+days+(list.length?list.map(c=>{const v=lastV(c),dn=v?.d===today();return `<div class="stop ${dn?'done':''}" onclick="openCust(${c.id})"><div><h3>${dn?'✓ ':''}${esc(c.name)}</h3><p>${esc(c.addr)}</p><p>Gate: <b>${esc(c.gate)||'—'}</b>${v?` · Last: pH ${v.ph??'–'}, Cl ${v.fc??'–'}`:''}</p>${tags(c)}</div><button class="btn" onclick="event.stopPropagation();openLog(${c.id})">Log visit</button></div>`}).join(''):`<div class="card" style="text-align:center;color:var(--mute)">${view==='route'?'No pools on '+day+'.':'No customers yet.'} Add one with “New customer”.</div>`)}
function sel(n,o,v){return `<select id="${n}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`}
function openCust(id){
 const c=C.find(x=>x.id===id)||{day,san:'Chlorine',surf:'Plaster',visits:[]};
 dlg.innerHTML=`<h2 style="margin-top:0">${id?'Edit':'New'} customer</h2>${offNote()}<div class="grid">
 <div class="full"><label>Name</label><input id="name" value="${esc(c.name)}"></div>
 <div><label>Phone</label><input id="phone" type="tel" value="${esc(c.phone)}"></div><div><label>Monthly rate ($)</label><input id="rate" type="number" value="${esc(c.rate)}"></div>
 <div class="full"><label>Service address</label><input id="addr" value="${esc(c.addr)}"></div>
 <div class="full"><label>Gate code / access</label><input id="gate" value="${esc(c.gate)}"></div>
 <div><label>Service day</label>${sel('day',DAYS,c.day)}</div><div><label>Pool volume (gal)</label><input id="gal" type="number" value="${esc(c.gal)}"></div>
 <div><label>Sanitizer</label>${sel('san',['Chlorine','Salt','Mineral','Bromine'],c.san)}</div><div><label>Surface</label>${sel('surf',['Plaster','Vinyl','Fiberglass','Pebble'],c.surf)}</div>
 <div class="full"><label>Equipment</label><input id="equip" value="${esc(c.equip)}"></div>
 <div class="full"><label><input type="checkbox" id="dog" style="width:auto" ${c.dog?'checked':''}> 🐕 Dog on site</label></div>
 <div class="full"><label>Notes</label><textarea id="notes" rows="2">${esc(c.notes)}</textarea></div></div>
 ${id&&c.visits.length?`<h3>Visit history</h3>${c.visits.slice(0,8).map(v=>`<div class="log"><b>${v.d}</b> · Cl ${v.fc??'–'} · pH ${v.ph??'–'} · TA ${v.ta??'–'}${v.chem?`<br>Added: ${esc(v.chem)}`:''}${v.note?`<br>${esc(v.note)}`:''}</div>`).join('')}`:''}
 <div class="row"><button class="btn ghost" onclick="dlg.close()">Cancel</button>${id?`<button class="btn ghost" onclick="delCust(${id})" ${OFFLINE?'disabled':''}>Delete</button>`:''}<button class="btn" onclick="saveCust(${id||0})" ${OFFLINE?'disabled':''}>Save</button></div><div class="err" id="dlgErr"></div>`;
 dlg.showModal()}
async function saveCust(id){
 const g=k=>$(k).value;if(!g('name').trim())return $('name').focus();
 const o={name:g('name').trim(),phone:g('phone'),addr:g('addr'),gate:g('gate'),day:g('day'),rate:+g('rate')||0,san:g('san'),surf:g('surf'),gal:+g('gal')||0,equip:g('equip'),dog:$('dog').checked,notes:g('notes')};
 const r=id?await sb.from('customers').update(o).eq('id',id):await sb.from('customers').insert(o);
 if(r.error)return isNetErr(r.error)?$('dlgErr').textContent='No signal, so this wasn’t saved. Keep this open and tap Save again when you have signal.':alert(r.error.message);dlg.close();load()}
async function delCust(id){if(!confirm('Delete this customer and their visit history?'))return;const r=await sb.from('customers').delete().eq('id',id);if(r.error)return isNetErr(r.error)?$('dlgErr').textContent='No signal, so this wasn’t saved. Keep this open and tap Save again when you have signal.':alert(r.error.message);dlg.close();load()}
function openLog(id){const c=C.find(x=>x.id===id);
 dlg.innerHTML=`<h2 style="margin-top:0">Log visit</h2><p style="color:var(--mute)">${esc(c.name)} · ${esc(c.addr)}</p>${offNote()}<div class="grid">
 <div><label>Free chlorine (ppm)</label><input id="fc" type="number" step=".1" inputmode="decimal"></div><div><label>pH</label><input id="ph" type="number" step=".1" inputmode="decimal"></div>
 <div class="full"><label>Alkalinity (ppm)</label><input id="ta" type="number" inputmode="decimal"></div>
 <div class="full"><label>Chemicals added</label><input id="chem" placeholder="e.g. 1 gal liquid chlorine"></div>
 <div class="full"><label>Notes</label><textarea id="note" rows="2"></textarea></div></div>
 <div class="row"><button class="btn ghost" onclick="dlg.close()">Cancel</button><button class="btn" onclick="saveLog(${id})" ${OFFLINE?'disabled':''}>Save visit</button></div><div class="err" id="dlgErr"></div>`;dlg.showModal()}
async function saveLog(id){
 const n=k=>$(k).value===''?null:+$(k).value;
 const r=await sb.from('visits').insert({customer_id:id,fc:n('fc'),ph:n('ph'),ta:n('ta'),chem:$('chem').value,note:$('note').value});
 if(r.error)return isNetErr(r.error)?$('dlgErr').textContent='No signal, so this wasn’t saved. Keep this open and tap Save again when you have signal.':alert(r.error.message);
 await sb.from('customers').update({last:today()}).eq('id',id);dlg.close();load()}
// ===== Home-screen install =====
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('inst').hidden=false});
addEventListener('appinstalled',()=>{$('inst').hidden=true;deferredPrompt=null});
async function install(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('inst').hidden=true}
function tipSeen(){try{return localStorage.getItem('pb_tip')==='1'}catch(e){return false}}
function hideTip(){try{localStorage.setItem('pb_tip','1')}catch(e){}const t=$('tip');if(t)t.remove()}
function iosTip(){return IOS&&!STANDALONE&&!tipSeen()?`<div class="tip" id="tip"><img src="/apple-touch-icon.png" alt=""><div><b>Put PoolBook on your home screen</b>In Safari, tap Share (the square with an arrow), then “Add to Home Screen”.</div><button class="x" aria-label="Dismiss" onclick="hideTip()">×</button></div>`:''}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
boot();
</script></body></html>
